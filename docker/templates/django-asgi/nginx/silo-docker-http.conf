# Silo (Docker) — HTTP only (testing, no TLS)
#
# Host Nginx → Docker web published on localhost.
#
# 1. cp to /etc/nginx/conf.d/silo-api.conf (edit CHANGE: values)
# 2. Compose: ports: "127.0.0.1:8000:8000"
# 3. sudo rm -f /etc/nginx/sites-enabled/default
# 4. sudo nginx -t && sudo systemctl reload nginx
#
# CHANGE: server_name → api.example.com or VPS IP
# CHANGE: port      → 8000

server {
    listen 80;
    listen [::]:80;
  # CHANGE: domain or IP
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /ws/ {
      # CHANGE: host port
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
      # CHANGE: host port
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Connection "";
    }
}
