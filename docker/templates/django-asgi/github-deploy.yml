# GitHub Actions: build to GHCR + SSH zero-downtime deploy
#
# Copy to your application repository as:
#   .github/workflows/deploy.yml
#
# Required repository secrets:
#   GHCR_TOKEN          — PAT or GITHUB_TOKEN with packages:write (often default GITHUB_TOKEN is enough)
#   DEPLOY_HOST         — VPS hostname or IP
#   DEPLOY_USER         — SSH user (e.g. deploy)
#   DEPLOY_SSH_KEY      — private key for DEPLOY_USER
#   DEPLOY_PATH         — absolute path to the app compose directory on the VPS
#
# Required repository variables (optional overrides):
#   IMAGE_NAME          — e.g. ghcr.io/org/silo (defaults to ghcr.io/<owner>/<repo>)

name: Build and Deploy (Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.IMAGE_NAME || format('{0}/{1}/{2}', env.REGISTRY, github.repository_owner, github.event.repository.name) }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Zero-downtime deploy over SSH
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            IMAGE="${{ vars.IMAGE_NAME || format('ghcr.io/{0}/{1}', github.repository_owner, github.event.repository.name) }}"
            TAG="${{ github.sha }}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            export GHCR_IMAGE="${IMAGE}"
            export IMAGE_TAG="${TAG}"

            docker compose pull web worker beat
            docker compose up -d --no-deps --force-recreate web
            docker compose up -d --no-deps --force-recreate worker beat

            # Optional migrate (uncomment if your image includes manage.py)
            # docker compose exec -T web python manage.py migrate --noinput

            docker image prune -f
            echo "Deploy complete: ${IMAGE}:${TAG}"
