# Blueprint: Django ASGI + Celery + Postgres + Redis
# Copy into your application repo and adjust image/env names.
#
# Requires the external Docker network `gateway` (created once on the VPS):
#   docker network create gateway

name: silo

services:
  web:
    image: ${GHCR_IMAGE:-ghcr.io/example/silo}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-app}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gateway
      - silo-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    image: ${GHCR_IMAGE:-ghcr.io/example/silo}:${IMAGE_TAG:-latest}
    container_name: app-worker
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "INFO"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-app}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - silo-internal

  beat:
    image: ${GHCR_IMAGE:-ghcr.io/example/silo}:${IMAGE_TAG:-latest}
    container_name: app-beat
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "INFO"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-app}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - silo-internal

  db:
    image: postgres:16-alpine
    container_name: app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - silo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: app-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - silo-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  gateway:
    external: true
    name: gateway
  silo-internal:
    driver: bridge
    name: silo-internal
