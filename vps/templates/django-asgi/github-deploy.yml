# GitHub Actions: native VPS SSH deploy
#
# Copy to your application repository as:
#   .github/workflows/deploy.yml
#
# Required repository secrets:
#   DEPLOY_HOST     — VPS hostname or IP
#   DEPLOY_USER     — SSH user (e.g. deploy)
#   DEPLOY_SSH_KEY  — private key for DEPLOY_USER
#   DEPLOY_PATH     — absolute path to the app on the VPS (e.g. /var/www/silo)

name: Deploy (VPS)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy with uv + systemd
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            cd "${{ secrets.DEPLOY_PATH }}"

            if [[ ! -x ./deploy.sh ]]; then
              echo "deploy.sh missing or not executable in ${{ secrets.DEPLOY_PATH }}"
              exit 1
            fi

            ./deploy.sh
            echo "Bare-metal deploy finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
