server {
    server_name silo-api.aswindev.in;

    # Global Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Serve Django Static Files directly via Nginx
    location /static/ {
            alias /var/www/silo/staticfiles/;
    }

        # Route WebSocket connections specifically

    location /ws/ {
        proxy_pass http://unix:/var/www/silo/silo.sock;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;

        # Increase timeouts so WebSocket connections don't drop unexpectedly
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Route standard HTTP API traffic
    location / {
        proxy_pass http://unix:/var/www/silo/silo.sock;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}